name: Feature request
description: Suggest something Muon should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: ask
    attributes:
      label: What would you like to ask Muon?
      description: Write it the way you'd type it into the palette, e.g. "compress the videos in ~/Movies older than a month".
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
