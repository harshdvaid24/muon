name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    name: mac-tools (MCP server)
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # node --test glob support needs Node >= 21
      - run: brew install ripgrep
      - run: npm install
      - run: npm run build
      - run: node --test "test/*.test.mjs"
