name: Muon
options:
  bundleIdPrefix: com.harshvaid
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Muon:
    type: application
    platform: macOS
    sources:
      - path: Muon
    info:
      path: Muon/Info.plist
      properties:
        CFBundleName: Muon
        CFBundleDisplayName: Muon
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.harshvaid.Muon
            CFBundleURLSchemes: [muon]
        NSAppleEventsUsageDescription: Muon asks apps to quit and runs menu commands you request.
        NSSpeechRecognitionUsageDescription: Muon transcribes audio files you choose, on-device.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Muon/Muon.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harshvaid.Muon
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MuonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MuonTests
    dependencies:
      - target: Muon
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.harshvaid.MuonTests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Muon.app/Contents/MacOS/Muon
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Muon:
    build:
      targets:
        Muon: all
        MuonTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MuonTests]
