name: MacAgent
options:
  bundleIdPrefix: com.harshvaid
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MacAgent:
    type: application
    platform: macOS
    sources:
      - path: MacAgent
    info:
      path: MacAgent/Info.plist
      properties:
        CFBundleName: MacAgent
        CFBundleDisplayName: MacAgent
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        CFBundleURLTypes:
          - CFBundleURLName: com.harshvaid.MacAgent
            CFBundleURLSchemes: [macagent]
        NSAppleEventsUsageDescription: MacAgent asks apps to quit gracefully when you request it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: MacAgent/MacAgent.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harshvaid.MacAgent
        GENERATE_INFOPLIST_FILE: NO
  MacAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacAgentTests
    dependencies:
      - target: MacAgent
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MacAgent.app/Contents/MacOS/MacAgent
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  MacAgent:
    build:
      targets:
        MacAgent: all
        MacAgentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [MacAgentTests]
